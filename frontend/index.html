<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>TallyOS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <nav class="tabs" aria-label="Main">
      <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>TallyOS</span></div>
      <a href="#/today" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg><span>Today</span></a>
      <a href="#/schedule" data-tab="schedule"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg><span>Schedule</span></a>
      <a href="#/clients" data-tab="clients"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c1.4-4 4.4-6 8-6s6.6 2 8 6"/></svg><span>Clients</span></a>
      <a href="#/growth" data-tab="growth"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19 10 13l4 4 6-8"/><path d="M15 9h5v5"/></svg><span>Growth</span></a>
      <a href="#/more" data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></a>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="tooltip" role="tooltip"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
